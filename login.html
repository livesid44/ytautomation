<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QA Analytics</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #1a2e61;
            background-image: url("images/login-bg.png");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: bottom;
            background-size: cover;
            font-family: 'Poppins-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .login-main {
            height: 100vh;
            position: relative;
        }
        .login-content {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 400px;
            padding: 30px;
            background-color: #fff;
            border-radius: 4px 4px 8px 8px;
            border-top: 4px solid #1a2e61;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .login-logo {
            max-width: 60%;
            height: auto;
            margin: 10px auto 30px auto;
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            color: #808080;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }
        .form-control {
            border-radius: 0;
            border-top: none;
            border-left: none;
            border-right: none;
            border-bottom: 1px solid #ccc;
            background-color: transparent;
            box-shadow: none;
            padding: 8px 0;
        }
        .form-control:focus {
            background-color: transparent;
            border-color: #1a2e61;
            box-shadow: none;
        }
        .btn-login {
            background-color: #000;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border-radius: 0;
            border: 1px solid #000;
            padding: 12px;
            width: 100%;
            margin-top: 10px;
            text-decoration: none;
            display: block;
            text-align: center;
        }
        .btn-login:hover {
            background-color: #333;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-main">
        <div class="login-content">
            <div style="text-align: center;">
                <img class="login-logo" src="images/logo.png" alt="Logo" />
            </div>
            <form>
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" class="form-control" placeholder="example@company.com" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••••" />
                </div>
                <div class="form-group">
                    <a href="totalauditcount.html" class="btn-login">LOGIN</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
